site_name: HytaleCity Plugin-Dokumentation
site_description: Plugins, Core-APIs, Administration und Architektur von HytaleCity
site_url: https://1tobu.github.io/hytale-city-docs/
repo_url: https://github.com/1Tobu/hytale-city-docs
repo_name: HytaleCity Dokumentation
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  custom_dir: overrides
  language: de
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Helles Design
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Dunkles Design
extra_css:
  - assets/item-catalog/catalog.css
extra_javascript:
  - assets/item-catalog/catalog.js
plugins:
  - i18n:
      docs_structure: suffix
      languages:
        - locale: de
          default: true
          name: Deutsch
          build: true
        - locale: en
          name: English
          build: true
          site_name: HytaleCity Plugin Documentation
          nav_translations:
            Start: Home
            Einstieg: Getting started
            Installation und Konfiguration: Installation and configuration
            Befehle und Berechtigungen: Commands and permissions
            Architektur: Architecture
            Zusammenspiel: How the plugins work together
            Daten und Threads: Data and threads
            Ablaufbeispiele: Example flows
            Minigames und Ausblick: Minigames and plans
            Überblick: Overview
            Ingame-Dokumentation: In-game documentation
            Postfach: Inbox
            Entwicklung: Development
            Core-APIs nutzen: Using the Core APIs
            NPC-Aktionen erweitern: Extending NPC actions
            Neuen Beruf hinzufügen: Adding a profession
            Eigene Zauberstäbe: Custom wands
            Bauen und Prüfen: Build and verification
            Dokumentation pflegen: Maintaining the documentation
            Betrieb: Operations
            Updates und Wiederherstellung: Updates and recovery
            Datenbankmigrationen: Database migrations
            Berufsaufträge und Belohnungen: Profession quests and rewards
            Fehler und Logs: Errors and logs
            Referenz: Reference
            Level-API im Detail: Level API details
            NPC- und Verkaufsverträge: NPC and sale contracts
            Hytale-Itemkatalog: Hytale item catalog
            Eigene Spielressourcen: Custom assets
            Plugin-Inventar und Quellstände: Plugin inventory and source revisions
  - search:
      lang: [de, en]
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Start: index.md
  - Einstieg:
      - Installation und Konfiguration: getting-started/setup.md
      - Befehle und Berechtigungen: getting-started/commands.md
  - Architektur:
      - Zusammenspiel: architecture/overview.md
      - Daten und Threads: architecture/data-and-threads.md
      - Ablaufbeispiele: architecture/flows.md
      - Minigames und Ausblick: architecture/minigames.md
  - Plugins:
      - Überblick: plugins/index.md
      - Core: plugins/core.md
      - CityBuild: plugins/citybuild.md
      - Homes: plugins/homes.md
      - Economy: plugins/economy.md
      - Postfach: plugins/inbox.md
      - Jobs: plugins/jobs.md
      - Level: plugins/level.md
      - HcNpcs: plugins/npcs.md
      - Enchantments: plugins/enchantments.md
      - PlayerStats: plugins/playerstats.md
      - PlayerHud: plugins/playerhud.md
      - AFK: plugins/afk.md
      - Teleport: plugins/teleport.md
      - Warp: plugins/warp.md
      - FarmWorld: plugins/farmworld.md
      - Protection: plugins/protection.md
      - Ingame-Dokumentation: plugins/documentation.md
  - Entwicklung:
      - Core-APIs nutzen: development/core-api.md
      - NPC-Aktionen erweitern: development/npc-actions.md
      - Neuen Beruf hinzufügen: development/new-profession.md
      - Eigene Zauberstäbe: development/wands.md
      - Hytale UIs und HUDs: development/ui.md
      - Bauen und Prüfen: development/build-and-test.md
      - Dokumentation pflegen: development/documentation.md
  - Betrieb:
      - Updates und Wiederherstellung: operations/updates.md
      - Datenbankmigrationen: operations/database-migrations.md
      - Berufsaufträge und Belohnungen: operations/profession-content.md
      - Fehler und Logs: operations/troubleshooting.md
  - Referenz:
      - Level-API im Detail: reference/level-api.md
      - NPC- und Verkaufsverträge: reference/npc-contracts.md
      - Hytale-Itemkatalog: reference/item-catalog.md
      - Eigene Spielressourcen: reference/custom-assets.md
      - Plugin-Inventar und Quellstände: reference/inventory.md
